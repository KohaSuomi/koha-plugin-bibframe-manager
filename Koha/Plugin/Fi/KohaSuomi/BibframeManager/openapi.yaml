---
/bibframe/convert:
  post:
    x-mojo-to: "Fi::KohaSuomi::BibframeManager::Controllers::BibframeController#convert"
    operationId: convertToBibframe
    x-koha-authorization:
      permissions:
        plugins: tool
    tags:
      - bibframe
    summary: Convert MARC21 to Bibframe
    description: Converts a MARC21 record to Bibframe format
    consumes:
      - application/json
    produces:
      - application/json
      - text/turtle
      - application/ld+json
      - application/n-triples
      - application/rdf+xml
      - text/plain
    parameters:
      - name: body
        in: body
        description: Conversion request parameters
        required: true
        schema:
          type: object
          required:
            - method
          properties:
            method:
              type: string
              description: "Input method: biblio, marc, or text"
              enum:
                - biblio
                - marc
                - text
            biblionumber:
              type: integer
              description: Biblionumber (required if method=biblio)
            marc_file:
              type: string
              description: Base64 encoded MARC file (required if method=marc)
            marc_text:
              type: string
              description: MARC text (required if method=text)
            base_uri:
              type: string
              description: Base URI for RDF resources
              default: "http://urn.fi/URN:NBN:fi:bib:"
            format:
              type: string
              description: Output format
              enum:
                - turtle
                - json-ld
                - ntriples
                - rdf-xml
                - json
              default: turtle
            standard:
              type: string
              description: "Conversion standard: bffi (Finnish BFFI) or loc (LoC BIBFRAME 2.0 via XSLT)"
              enum:
                - bffi
                - loc
              default: loc
    responses:
      200:
        description: Successful conversion
        schema:
          type: object
          properties:
            success:
              type: boolean
              description: Conversion success status
            triples:
              type: array
              description: Array of RDF triples
              items:
                type: object
                properties:
                  subject:
                    type: string
                  predicate:
                    type: string
                  object:
                    type: string
                  object_type:
                    type: string
            formatted:
              type: string
              description: Formatted output in requested format
            format:
              type: string
              description: Output format used
            triple_count:
              type: integer
              description: Number of triples generated
            biblionumber:
              type: integer
              description: Biblionumber of the converted record
            message:
              type: string
              description: Success message
      400:
        description: Bad request - invalid input
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
      404:
        description: Record not found
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
      500:
        description: Internal server error
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
/bibframe/store:
  post:
    x-mojo-to: "Fi::KohaSuomi::BibframeManager::Controllers::BibframeController#store_export"
    operationId: exportFromStore
    x-koha-authorization:
      permissions:
        plugins: tool
    tags:
      - bibframe
    summary: Export BIBFRAME from the semantic store
    description: Reads a stored record from the semantic store and exports it as LoC 3-level or BFFI 4-level WEMI RDF
    consumes:
      - application/json
    produces:
      - application/json
      - text/turtle
      - application/ld+json
      - application/n-triples
      - application/rdf+xml
      - text/plain
    parameters:
      - name: body
        in: body
        description: Export request parameters
        required: true
        schema:
          type: object
          required:
            - method
          properties:
            method:
              type: string
              description: "Lookup method: resource_id or biblio_id"
              enum:
                - resource_id
                - biblio_id
            resource_id:
              type: integer
              description: record_resources.id to export (required if method=resource_id)
            biblio_id:
              type: integer
              description: Koha biblionumber whose graph to export (required if method=biblio_id)
            base_uri:
              type: string
              description: Base URI for RDF resources
              default: "http://urn.fi/URN:NBN:fi:bib:"
            format:
              type: string
              description: Output format
              enum:
                - turtle
                - json-ld
                - ntriples
                - rdf-xml
                - json
              default: json
            standard:
              type: string
              description: "Export standard: loc (LoC 3-level, default) or bffi (BFFI 4-level WEMI)"
              enum:
                - bffi
                - loc
              default: loc
    responses:
      200:
        description: Successful export
        schema:
          type: object
          properties:
            triples:
              type: array
              description: Array of RDF triples
              items:
                type: object
                properties:
                  subject:
                    type: string
                  predicate:
                    type: string
                  object:
                    type: string
                  object_type:
                    type: string
            formatted:
              type: string
              description: Formatted output in requested format
            format:
              type: string
              description: Output format used
            standard:
              type: string
              description: Output standard used (loc or bffi)
            triple_count:
              type: integer
              description: Number of triples generated
            resource_id:
              type: integer
              description: Resource ID exported
            biblio_id:
              type: integer
              description: Biblionumber exported
            message:
              type: string
              description: Success message
      400:
        description: Bad request - invalid input
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
      404:
        description: Record not found
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
      500:
        description: Internal server error
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
/bibframe/summary:
  get:
    x-mojo-to: "Fi::KohaSuomi::BibframeManager::Controllers::BibframeController#summary"
    operationId: getSummary
    x-koha-authorization:
      permissions:
        plugins: tool
    tags:
      - bibframe
    summary: Read stored semantic summary for a biblio
    description: Reads the stored semantic data for a biblio from the typed summary tables (record_work_summary, record_instance_summary, record_agent_summary) instead of biblio_metadata
    produces:
      - application/json
    parameters:
      - name: biblio_id
        in: query
        description: Koha biblionumber whose stored summary to read
        required: true
        type: integer
    responses:
      200:
        description: Successful summary read
        schema:
          type: object
          properties:
            biblio_id:
              type: integer
              description: Biblionumber whose summary was read
            work:
              type: object
              description: Work summary row (record_work_summary) plus resource uri
            instances:
              type: array
              description: Instance summary rows (record_instance_summary) plus uri
              items:
                type: object
            agents:
              type: array
              description: Agents (record_agent_summary) linked to the Work via creator/contributor relationships
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  name_normalized:
                    type: string
                  agent_type:
                    type: string
                  role:
                    type: string
      400:
        description: Bad request - biblio_id required
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message
      500:
        description: Internal server error
        schema:
          type: object
          properties:
            error:
              type: string
              description: Error message


