# ===================================================================
# ADMINISTRATIVE METADATA MAPPINGS
# ===================================================================
admin_metadata:
  '040':
    property: 'bffi:adminMetadata'
    subproperties:
      a: 'bffi:descriptionModifier'
      b: 'bffi:descriptionLanguage'
      c: 'bffi:descriptionModifier'
      d: 'bffi:descriptionModifier'
      e: 'bffi:descriptionConventions'
  
  Leader:
    '05':
      property: 'bffi:status'
      mapping:
        a: 'Increase'
        c: 'Corrected'
        d: 'Deleted'
        'n': 'New'
        p: 'Increase'
    '17':
      property: 'bffi:encodingLevel'
      mapping:
        ' ': 'Full'
        '1': 'Full, not examined'
        '2': 'Less-than-full'
        '3': 'Abbreviated'
        '4': 'Core'
        '5': 'Partial'
        '7': 'Minimal'
        '8': 'Pre-publication'
        u: 'Unknown'
        z: 'NotApplicable'

