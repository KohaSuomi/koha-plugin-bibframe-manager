# ===================================================================
# DATA TYPES
# ===================================================================
datatypes:
  string: "http://www.w3.org/2001/XMLSchema#string"
  date: "http://www.w3.org/2001/XMLSchema#date"
  datetime: "http://www.w3.org/2001/XMLSchema#dateTime"
  integer: "http://www.w3.org/2001/XMLSchema#integer"
  decimal: "http://www.w3.org/2001/XMLSchema#decimal"
  boolean: "http://www.w3.org/2001/XMLSchema#boolean"
  uri: "http://www.w3.org/2001/XMLSchema#anyURI"
  language: "http://www.w3.org/1999/02/22-rdf-syntax-ns#langString"

# ===================================================================
# PROCESSING RULES
# ===================================================================
processing_rules:
  # Multiple values handling
  multiple_values:
    strategy: "array"
    separator: "; "
    preserve_order: true
  
  # URI resolution
  uri_resolution:
    dereference: true
    follow_redirects: true
    cache_ttl_seconds: 3600
    timeout_seconds: 30
  
  # Language tags
  language_tags:
    default: "en"
    preserve_original: true
    normalize: false
  
  # Empty values
  empty_values:
    skip_empty_strings: true
    skip_null: true
    null_representation: null
  
  # Namespace handling
  normalize_namespaces: true
  use_prefixes: true
  
  # Label preference
  label_preference_order:
    - "rdfs:label"
    - "skos:prefLabel"
    - "foaf:name"
    - "bf:code"
    - "rdf:value"
  
  # Date formatting
  date_format:
    output_format: "ISO8601"
    timezone: "UTC"
  
  # URI construction
  uri_construction:
    use_https: true
    normalize_path: true
    encode_special_chars: true

# ===================================================================
# ENTITY RELATIONSHIPS
# ===================================================================
relationships:
  work_to_instance:
    forward_property: "bf:hasInstance"
    reverse_property: "bf:instanceOf"
    cardinality: "1:n"
    description: "A Work can have multiple Instances; an Instance must have exactly one Work"
  
  instance_to_item:
    forward_property: "bf:hasItem"
    reverse_property: "bf:itemOf"
    cardinality: "1:n"
    description: "An Instance can have multiple Items; an Item must have exactly one Instance"
  
  work_to_subject:
    forward_property: "bf:subject"
    cardinality: "n:n"
    description: "A Work can have multiple subjects"
  
  work_to_contribution:
    forward_property: "bf:contribution"
    cardinality: "1:n"
    description: "A Work can have multiple contributions"

